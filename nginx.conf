server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static assets caching
    location ~* \.(css|js|ico|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Health endpoint for Docker/k8s probes
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"syspulse"}';
        add_header Content-Type application/json;
    }

    # Metrics stub (for Prometheus scraping in demo)
    location /metrics {
        access_log off;
        return 200 '# HELP nginx_up Nginx is up\n# TYPE nginx_up gauge\nnginx_up 1\n';
        add_header Content-Type text/plain;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
