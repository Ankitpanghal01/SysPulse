---
# ── Ingress (AWS ALB) ─────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syspulse
  namespace: syspulse
  labels:
    app: syspulse
  annotations:
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/CERT_ID"
    alb.ingress.kubernetes.io/healthcheck-path: "/health"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/load-balancer-attributes: "idle_timeout.timeout_seconds=60"
    # CORS
    alb.ingress.kubernetes.io/actions.response-403: >
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"403","messageBody":"Forbidden"}}
spec:
  rules:
    - host: syspulse.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syspulse
                port:
                  name: http

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: syspulse-netpol
  namespace: syspulse
spec:
  podSelector:
    matchLabels:
      app: syspulse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ALB / ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 80
    # Allow Prometheus scraping from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS for external fonts (Google Fonts)
    - ports:
        - protocol: TCP
          port: 443

---
# ── PodDisruptionBudget ───────────────────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: syspulse-pdb
  namespace: syspulse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: syspulse

---
# ── ServiceMonitor (Prometheus Operator) ─────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: syspulse
  namespace: syspulse
  labels:
    app: syspulse
    release: prometheus-stack        # matches Helm release label selector
spec:
  selector:
    matchLabels:
      app: syspulse
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
